<style>
/* Layout: an index-style page. Each section is a heading, then rows with dotted leaders running to dates, like a table of contents. Arabic is the default, English is one tap away. */
:root {
  --bg: #F7F5FA;
  --surface: #FFFFFF;
  --ink: #1D1626;
  --muted: #62586F;
  --rule: #CFC6DB;
  --accent: #5A2D82;
  --accent-ink: #FFFFFF;
  --accent-soft: #EAE1F4;
  --f-display-ar: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --f-display-en: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14101A;
    --surface: #1D1726;
    --ink: #F0EBF6;
    --muted: #A99FB8;
    --rule: #3A3047;
    --accent: #C7A6EA;
    --accent-ink: #14101A;
    --accent-soft: #2B2038;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14101A;
  --surface: #1D1726;
  --ink: #F0EBF6;
  --muted: #A99FB8;
  --rule: #3A3047;
  --accent: #C7A6EA;
  --accent-ink: #14101A;
  --accent-soft: #2B2038;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
html[lang="en"] body { line-height: 1.65; }
.wrap { max-width: 880px; margin-inline: auto; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.display { font-weight: 400; text-wrap: balance; }
html[lang="ar"] .display { font-family: var(--f-display-ar); }
html[lang="en"] .display { font-family: var(--f-display-en); }
html[lang="en"] .caps { letter-spacing: 0.08em; text-transform: uppercase; }

.top { display: flex; justify-content: flex-end; padding-bottom: 28px; }
.chip {
  font: inherit; font-size: 0.9rem; font-weight: 500;
  background: transparent; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: 0.3rem 0.95rem; cursor: pointer; line-height: 1.5;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* hero */
.eyebrow { color: var(--accent); font-size: 0.88rem; font-weight: 600; margin: 0 0 0.6rem; }
h1.display { font-size: clamp(2.7rem, 11.5vw, 5.4rem); line-height: 1.08; margin: 0; font-weight: 700; }
html[lang="en"] h1.display { font-weight: 500; letter-spacing: -0.01em; }
.focus { font-size: clamp(1.35rem, 5vw, 2rem); color: var(--muted); margin: 0.5rem 0 0; line-height: 1.4; }
.intro { max-width: 60ch; margin: 1.5rem 0 0; font-size: 1.05rem; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 1.5rem; }
.btn {
  display: inline-block; text-decoration: none; font-weight: 500;
  background: var(--accent); color: var(--accent-ink);
  border-radius: 6px; padding: 0.55rem 1.2rem; line-height: 1.6;
}
.btn:hover { filter: brightness(1.08); }
.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding-block: calc(0.55rem - 1px); }
.mail {
  display: inline-flex; align-items: center; gap: 0.6rem; min-width: 0; max-width: 100%;
  border: 1px solid var(--rule); background: var(--surface); border-radius: 6px;
  padding-block: 0.2rem; padding-inline: 0.85rem 0.2rem; font-size: 0.92rem;
}
.mail bdi { min-width: 0; overflow-wrap: anywhere; }
.copy {
  font: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer;
  background: var(--accent-soft); color: var(--accent);
  border: 0; border-radius: 4px; padding: 0.35rem 0.8rem; white-space: nowrap;
}
.facts {
  margin: 2.25rem 0 0; padding-top: 1.25rem; border-top: 1px solid var(--rule);
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem;
}
.facts > div { min-width: 0; }
.facts dt { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.facts dd { margin: 0.2rem 0 0; font-size: 0.95rem; line-height: 1.6; }

/* sections */
section { margin-top: 3rem; padding-top: 1.4rem; border-top: 1px solid var(--rule); }
h2.display { font-size: 2rem; line-height: 1.25; margin: 0 0 1.25rem; font-weight: 700; }
html[lang="en"] h2.display { font-weight: 500; }

.rows { display: grid; gap: 1rem; }
.row { display: flex; align-items: baseline; gap: 0.6rem; }
.row .t { font-weight: 500; flex: 0 1 auto; min-width: 0; line-height: 1.55; }
.row .o { display: block; color: var(--muted); font-weight: 400; font-size: 0.88rem; line-height: 1.55; }
.row .d { flex: 1; display: flex; align-items: baseline; gap: 0.6rem; min-width: 0; justify-content: flex-end; }
.row .d::before {
  content: ""; flex: 1; min-width: 1rem;
  border-bottom: 1.5px dotted var(--rule); transform: translateY(-0.25em);
}
.row .d span { white-space: nowrap; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .row { flex-wrap: wrap; gap: 0; }
  .row .t { flex-basis: 100%; }
  .row .d { flex: none; }
  .row .d::before { display: none; }
}

.job { display: grid; gap: 0.5rem; }
.job + .job { margin-top: 1.75rem; }
.pts { margin: 0; padding-inline-start: 1.25rem; color: var(--ink); font-size: 0.95rem; }
.pts li { margin-top: 0.15rem; }
.pts li::marker, .laws li::marker { color: var(--accent); }
.note { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.95rem; max-width: 62ch; }

/* work */
.feature {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  padding: 1.25rem;
}
.kind { color: var(--accent); font-size: 0.82rem; font-weight: 600; margin: 0; }
h3.display { font-size: 1.65rem; line-height: 1.3; margin: 0.3rem 0 0.6rem; font-weight: 700; }
html[lang="en"] h3.display { font-weight: 500; }
.feature p.body { margin: 0; max-width: 62ch; }
.laws { columns: 2 15rem; column-gap: 2rem; margin: 1rem 0; padding-inline-start: 1.5rem; }
html[lang="ar"] .laws { list-style-type: arabic-indic; }
.laws li { break-inside: avoid; padding-block: 0.1rem; }
.more { color: var(--accent); font-weight: 500; text-underline-offset: 0.2em; }
.paper { margin-top: 1.5rem; padding-top: 1.1rem; border-top: 1px dotted var(--rule); }
.paper h3 { font-size: 1.3rem; }
.job > .more { justify-self: start; }
.pts .more { white-space: nowrap; }
.paper p.body { margin: 0 0 0.6rem; max-width: 62ch; }
.paper .rows { margin-top: 0.9rem; }
h2 + .paper { margin-top: 0; padding-top: 0; border-top: 0; }
bdi.nw { white-space: nowrap; }

.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem 2rem; margin: 0 0 1.75rem; }
.skills dt { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.skills dd { margin: 0.2rem 0 0; font-size: 0.95rem; line-height: 1.7; }

footer { margin-top: 3.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.85rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    { t: { ar: 'الذكاء الاصطناعي والقانون: المسؤولية والشفافية والحوكمة', en: 'AI and the Law: Liability, Transparency, and Governance' }, o: { ar: 'جمعية طلبة القانون السعوديين، جامعة واشنطن في سانت لويس', en: 'Saudi Law Students Association, Washington University in St. Louis' }, d: { ar: 'سبتمبر 2026', en: 'Sep 2026' } },
    { t: { ar: 'جلسات الفنتك الصيفية', en: 'Fintech Summer Sessions' }, d: { ar: '2025', en: '2025' } },
    { t: { ar: 'برنامج الإعداد المهني', en: 'Career Readiness Program' }, o: { ar: 'مؤسسة مسك', en: 'Misk Foundation' }, d: { ar: 'فبراير 2025', en: 'Feb 2025' } },
    { t: { ar: 'برنامج ماكينزي للمستقبل (<bdi dir="ltr">McKinsey Forward</bdi>)', en: 'McKinsey Forward Program' }, d: { ar: '2025', en: '2025' } },
    { t: { ar: 'إتمام أكثر من 20 دورة من الهيئة السعودية للمحامين', en: 'Completed over 20 courses with the Saudi Bar Association' } },
    { t: { ar: 'إتمام دورات من المركز السعودي للتحكيم التجاري', en: 'Completed courses with the Saudi Center for Commercial Arbitration' }, d: { ar: '2026', en: '2026' } }
  ],

  skillH: { ar: 'المهارات واللغات', en: 'Skills & languages' },
  skills: [
    { k: { ar: 'المهارات القانونية', en: 'Legal skills' },
      v: { ar: 'صياغة العقود ومراجعتها · صياغة صحائف الدعوى · صياغة مختلف المذكرات القانونية · إعداد العروض المالية والفنية · إعداد العروض السعرية · التحليل القانوني · البحث القانوني · الترافع', en: 'Contract drafting and review · Drafting statements of claim · Drafting various legal memoranda · Preparing financial and technical proposals · Preparing price quotations · Legal analysis · Legal research · Pleading' } },
    { k: { ar: 'المهارات الناعمة', en: 'Soft skills' },
      v: { ar: 'التفاوض · التحدث أمام الجمهور · التفكير النقدي وحل المشكلات · إدارة الوقت · التواصل الفعال والعمل الجماعي · المرونة والتكيف', en: 'Negotiation · Public speaking · Critical thinking and problem solving · Time management · Effective communication and teamwork · Flexibility and adaptability' } }
  ],
  langs: [
    { t: { ar: 'العربية', en: 'Arabic' }, d: { ar: 'اللغة الأم', en: 'Native' } },
    { t: { ar: 'الإنجليزية', en: 'English' }, d: { ar: 'متقن', en: 'Advanced' } },
    { t: { ar: 'الإيطالية', en: 'Italian' }, d: { ar: 'مبتدئ', en: 'Beginner' } }
  ],
  foot: { ar: 'سمر أحمد الجارالله · 2026', en: 'Samar Ahmad Aljarallah · 2026' }
};

var lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
function p(o) { return o[lang]; }

function row(t, o, d) {
  return '<div class="row"><span class="t">' + p(t) + (o ? '<span class="o">' + p(o) + '</span>' : '') + '</span>' +
    (d ? '<span class="d"><span>' + p(d) + '</span></span>' : '') + '</div>';
}
function list(pts) {
  var h = '<ul class="pts">';
  pts.forEach(function (x) { h += '<li>' + p(x) + '</li>'; });
  return h + '</ul>';
}
function linkEl(l) {
  return '<a class="more" href="' + l.u + '" target="_blank" rel="noopener">' + p(l.t) + ' ↗</a>';
}

function render() {
  var h = '';
  h += '<h1 class="display">' + p(D.name) + '</h1>';
  h += '<p class="intro">' + p(D.intro) + '</p>';
  h += '<div class="actions">';
  h += '<a class="btn" href="' + LINKEDIN + '" target="_blank" rel="noopener">' + p(D.linkedin) + ' ↗</a>';
  h += '<a class="btn alt" href="' + X_URL + '" target="_blank" rel="noopener">' + p(D.xlabel) + ' ↗</a>';
  h += '<div class="mail"><bdi dir="ltr" id="mail">' + EMAIL + '</bdi>';
  h += '<button type="button" class="copy" data-copy="' + EMAIL + '"><span class="c1">' + p(D.copy) + '</span><span class="c2" hidden>' + p(D.copied) + '</span></button></div>';
  h += '</div>';
  h += '<dl class="facts">';
  D.facts.forEach(function (f) { h += '<div><dt class="caps">' + p(f.k) + '</dt><dd>' + p(f.v) + '</dd></div>'; });
  h += '</dl>';

  h += '<section id="work"><h2 class="display">' + p(D.workH) + '</h2>';
  h += '<div class="paper">';
  h += '<h3 class="display">' + p(D.guide.title) + '</h3>';
  h += '<p class="body">' + p(D.guide.body) + '</p><ol class="laws">';
  D.guide.laws.forEach(function (x) { h += '<li>' + p(x) + '</li>'; });
  h += '</ol><a class="more" href="' + GUIDE_URL + '" target="_blank" rel="noopener">' + p(D.guide.link) + ' ↗</a></div>';
  D.works.forEach(function (w) {
    h += '<div class="paper"><h3 class="display">' + p(w.t) + '</h3><p class="body">' + p(w.b) + '</p><a class="more" href="' + w.u + '" target="_blank" rel="noopener">' + p(D.guide.link) + ' ↗</a></div>';
  });
  h += '</section>';

  h += '<section id="papers"><h2 class="display">' + p(D.papersH) + '</h2><div class="rows">';
  D.papers.forEach(function (x) {
    h += '<div class="row"><span class="t">' + p(x.t) + (x.o ? '<span class="o">' + p(x.o) + '</span>' : '') + '</span>' +
      (x.u ? '<span class="d"><span><a class="more" href="' + x.u + '" target="_blank" rel="noopener">' + p(D.open) + ' ↗</a></span></span>' : '') + '</div>';
  });
  h += '</div></section>';

  h += '<section id="experience"><h2 class="display">' + p(D.expH) + '</h2>';
  D.jobs.forEach(function (j) {
    h += '<article class="job">' + row(j.t, j.o, j.d) + list(j.pts) + '</article>';
  });
  h += '</section>';

  h += '<section id="activities"><h2 class="display">' + p(D.actH) + '</h2>';
  D.acts.forEach(function (a) {
    h += '<article class="job">' + row(a.t, a.o, a.d) + list(a.pts) + (a.link ? linkEl(a.link) : '') + '</article>';
  });
  h += '</section>';

  h += '<section id="volunteering"><h2 class="display">' + p(D.volH) + '</h2>';
  D.vols.forEach(function (v) {
    h += '<article class="job">' + row(v.t, null, null) + list(v.pts) + '</article>';
  });
  h += '</section>';

  h += '<section id="certifications"><h2 class="display">' + p(D.certH) + '</h2><div class="rows">';
  D.certs.forEach(function (c) { h += row(c.t, c.o, c.d); });
  h += '</div></section>';

  h += '<section id="skills"><h2 class="display">' + p(D.skillH) + '</h2><dl class="skills">';
  D.skills.forEach(function (s) { h += '<div><dt class="caps">' + p(s.k) + '</dt><dd>' + p(s.v) + '</dd></div>'; });
  h += '</dl><div class="rows">';
  D.langs.forEach(function (x) { h += row(x.t, null, x.d); });
  h += '</div></section>';

  document.getElementById('app').innerHTML = h;
  document.getElementById('foot').textContent = p(D.foot);
  document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'العربية';
  document.getElementById('lang').setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
}

document.getElementById('lang').addEventListener('click', function () {
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  render();
});

function selectMail() {
  var el = document.getElementById('mail');
  if (!el) return;
  var r = document.createRange();
  r.selectNodeContents(el);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-copy]') : null;
  if (!b) return;
  var c1 = b.querySelector('.c1'), c2 = b.querySelector('.c2');
  function done() {
    c1.hidden = true; c2.hidden = false;
    setTimeout(function () { c1.hidden = false; c2.hidden = true; }, 1800);
  }
  try {
    navigator.clipboard.writeText(b.getAttribute('data-copy')).then(done, selectMail);
  } catch (err) { selectMail(); }
});

render();
</script>

</body>
</html>
